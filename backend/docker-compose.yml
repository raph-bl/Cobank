version: "3.9"

services:
    db:
        image: postgres:15
        container_name: cobank_db
        restart: always
        environment:
            POSTGRES_DB: cobank
            POSTGRES_USER: cobank_user
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:

